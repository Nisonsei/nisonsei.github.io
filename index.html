<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anime Age Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Guess the Anime Characters' Ages!</h1>

  <button id="startDaily">Start Daily</button>
  <button id="startFemale">Female only</button>
  <button id="startMale">Male only</button>

  <div id="content" class="hidden">
    <div id="game-container">
        <p>Loading characters...</p>
    </div>
    <div>
        <button id="shuffle-button">Shuffle Guess</button>
        <button id="guess-button">Guess</button>
    </div>
   </div>

  <script src="script.js"></script>
</body>
</html>
