<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anime Age Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 id="header">Guess the Anime Characters' Ages!</h1>

  <button id="startDaily">All Genders</button>
  <button id="startFemale">Female only</button>
  <button id="startMale">Male only</button>
  <div id="difficulty">
    <label for="slider">Choose number of available Hints: </label>
    <input type="range" id="slider" min="0" max="5" value="0">
    <span id="sliderValue">2</span>
  </div>

  <div id="content" class="hidden">
    <div id="game-container">
        <p>Loading characters...</p>
    </div>
    <div>
        <button id="shuffle-button">Shuffle</button>
        <button id="guess-button">Guess</button>
        <p id="hints"></p>
    </div>
    <div id="guessHistory0" class="guess-history firstHistory">
      <p></p>
    </div>
    <div id="guessHistory1" class="guess-history">
      <p></p>
    </div>
   </div>

  <script src="userInterface.js"></script>
  <script src="gameLogic.js"></script>
</body>
</html>
